# XcodeGen spec for WoWMobile, the iOS app bundle (`xcodegen generate --spec ios/project.yml`). Xcode only
# signs and packages here: the game is cargo's `benilla` binary, built beforehand by
# ios/run-device.sh and copied over a placeholder executable before Xcode code-signs the bundle.
name: WoWMobile
options:
  bundleIdPrefix: dev.benilla
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # The copy phase reads cargo's target/ folder, outside what a sandboxed script may touch.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  WoWMobile:
    type: application
    platform: iOS
    sources:
      - path: stub
      # Generated by ios/run-device.sh from the install's logo (gitignored, never committed).
      - path: Assets.xcassets
    # Not XcodeGen's `info:`, which regenerates the file: Info.plist is hand-written (scene manifest,
    # landscape, file sharing) and only referenced here.
    settings:
      base:
        PRODUCT_NAME: WoWMobile
        PRODUCT_BUNDLE_IDENTIFIER: $(BENILLA_BUNDLE_ID)
        BENILLA_BUNDLE_ID: dev.benilla.ios
        BENILLA_PROFILE: release
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: WoWMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        ONLY_ACTIVE_ARCH: YES
        ARCHS: arm64
        # The Rust binary is already optimized; keep Xcode from stripping its symbols for crash logs.
        STRIP_INSTALLED_PRODUCT: NO
        COPY_PHASE_STRIP: NO
        DEBUG_INFORMATION_FORMAT: dwarf
    postBuildScripts:
      - name: Embed Rust binary
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          case "$PLATFORM_NAME" in
            iphoneos) triple=aarch64-apple-ios ;;
            iphonesimulator) triple=aarch64-apple-ios-sim ;;
            *) echo "error: unsupported platform $PLATFORM_NAME"; exit 1 ;;
          esac
          bin="$SRCROOT/../target/$triple/$BENILLA_PROFILE/benilla"
          if [ ! -f "$bin" ]; then
            echo "error: $bin is missing; build it first (ios/run-device.sh does)"
            exit 1
          fi
          cp -f "$bin" "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
